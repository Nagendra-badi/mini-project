# Server Configuration
server.port=${PORT:8080}

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Database Server Details (Split for high readability)
db.host=${DB_HOST:dpg-d9v7rt5bedkc73b2s9hg-a}
db.port=${DB_PORT:5432}
db.name=${DB_NAME:ddms_c6of}

# Database Credentials
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ddms_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:hfkmsilF3b6mjfJiETzkoDLAK7HesmM5}

# JDBC Connection URL (Combines Host, Port, and Database Name dynamically)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${db.host}:${db.port}/${db.name}}
spring.datasource.driverClassName=org.postgresql.Driver

# Prevent startup crash if database is temporarily offline or DNS is propagating
spring.datasource.hikari.initialization-fail-timeout=-1
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# JPA/Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Document Storage Configuration (Customizable via environment variable on Render)
storage.local.dir=${STORAGE_LOCAL_DIR:./document-storage}

